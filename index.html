
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bazaar Admin</title>
    <meta name="description" content="Bazaar: run the market." />
    <style>
      /* The splash below paints before the app's stylesheet arrives, so it
         carries its own copy of the two tokens it needs. */
      :root { --boot-bg: oklch(1 0 0); --boot-fg: oklch(0.218 0.008 223.9); --boot-on: oklch(0.987 0.002 197.1); }
      html.dark { --boot-bg: oklch(0.148 0.004 228.8); --boot-fg: oklch(0.925 0.005 214.3); --boot-on: oklch(0.218 0.008 223.9); }
      html, body { margin: 0; background: var(--boot-bg); }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: var(--boot-bg);
        transition: opacity 300ms ease-out;
      }
      #boot[data-done] { opacity: 0; pointer-events: none; }
      #boot .mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 0.875rem;
        background: var(--boot-fg);
        color: var(--boot-on);
        animation: boot-breathe 1.8s ease-in-out infinite;
      }
      #boot .halo {
        position: absolute;
        width: 3rem;
        height: 3rem;
        border-radius: 0.875rem;
        background: var(--boot-fg);
        opacity: 0.25;
        animation: boot-halo 1.8s ease-in-out infinite;
      }
      #boot .bar {
        position: relative;
        width: 8rem;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in oklab, var(--boot-fg) 18%, transparent);
      }
      #boot .bar span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--boot-fg);
        animation: boot-sweep 1.4s ease-in-out infinite;
      }
      @keyframes boot-breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.72; transform: scale(0.94); } }
      @keyframes boot-halo { 0% { opacity: 0.35; transform: scale(0.85); } 70%, 100% { opacity: 0; transform: scale(1.45); } }
      @keyframes boot-sweep {
        0% { transform: translateX(-100%) scaleX(0.4); }
        50% { transform: translateX(0%) scaleX(0.7); }
        100% { transform: translateX(100%) scaleX(0.4); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .mark, #boot .halo, #boot .bar span { animation: none; }
      }
      html.a11y-reduce-motion #boot .mark,
      html.a11y-reduce-motion #boot .halo,
      html.a11y-reduce-motion #boot .bar span { animation: none; }
    </style>
    <script>
      // The theme and the display preferences, before the first paint: the
      // splash, and then the app behind it, come up in the right one rather
      // than flashing light and settling dark. ThemeProvider and applyA11yPrefs
      // set the same classes once React is running.
      (function () {
        try {
          var theme = localStorage.getItem("vite-ui-theme") || "system";
          var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
          var prefs = JSON.parse(localStorage.getItem("bazaar:a11y") || "{}");
          if (prefs.reduceMotion) document.documentElement.classList.add("a11y-reduce-motion");
        } catch (error) {
          // No storage: the defaults below are already correct.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Held until React first renders, then faded out by dismissBootSplash. -->
    <div id="boot" role="status" aria-label="Loading Bazaar Admin">
      <span class="mark">
        <span class="halo"></span>
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" style="position: relative">
          <path d="M4.5 2v12M11.5 2v12" stroke="currentColor" stroke-width="1.2" />
          <rect x="3" y="4" width="3" height="6" rx="0.5" fill="currentColor" />
          <rect x="10" y="6.5" width="3" height="5" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2" />
        </svg>
      </span>
      <span class="bar"><span></span></span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
